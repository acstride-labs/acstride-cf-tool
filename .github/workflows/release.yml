name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.5.0-alpha.1)
        required: true
        type: string
      upload_assets:
        description: Upload to an existing Release (otherwise build and verify only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate tag and pin exact source
        id: metadata
        shell: bash
        run: |
          python packaging/release.py version "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python packaging/test-public-fetch.py
      - run: python packaging/test-release.py
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build ./...

  build:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: go mod download all
      - run: go mod verify
      - name: Build versioned archive
        env:
          TARGET_OS: ${{ matrix.os }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: python packaging/release.py build "$RELEASE_TAG" --os "$TARGET_OS" --arch "$TARGET_ARCH"
      - name: Smoke-test the Linux x64 release binary
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        run: |
          mkdir -p dist/smoke
          tar -xzf dist/release/*.tar.gz -C dist/smoke
          dist/smoke/*/codeforces-client --version > dist/version.json
          python -c 'import json, os; assert json.load(open("dist/version.json"))["data"]["version"] == os.environ["RELEASE_TAG"][1:]'
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  assemble:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Verify archives, extract standalone binaries and checksum all downloads
        run: python packaging/release.py verify "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-assets
          path: dist/release/*
          if-no-files-found: error

  upload:
    needs: [prepare, assemble]
    if: github.event_name == 'release' || inputs.upload_assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-assets
          path: dist/release
      - name: Upload verified assets without replacing published files
        env:
          GH_TOKEN: ${{ github.token }}
        run: python packaging/upload-release.py "$RELEASE_TAG"
